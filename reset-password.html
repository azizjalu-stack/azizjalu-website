<!DOCTYPE html>
<html lang="om">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Haaromsi | Aziz Jalu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .box {
            width: min(90%, 420px);
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: 0;
            border-radius: 10px;
            background: #e00000;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🔐 Password Haaromsi</h1>

        <p>
            Password haaraa galchi.
        </p>

        <input
            type="password"
            id="newPassword"
            placeholder="Password haaraa"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Password irra deebi'i"
        >

        <button id="updateButton">
            Password Haaromsi
        </button>

        <p id="message"></p>

    </div>


    <script>
        "use strict";

        const SUPABASE_URL =
            "https://eencoolaxscedvnsezlm.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_BgeLKnjMqJxVfRY-JWhxvg_OjNnUKl2";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const updateButton =
            document.getElementById("updateButton");

        const message =
            document.getElementById("message");


        updateButton.addEventListener(
            "click",
            async function () {

                const password =
                    document
                        .getElementById("newPassword")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                if (!password || !confirmPassword) {
                    message.textContent =
                        "Password lamaan isaanii guuti.";
                    return;
                }


                if (password !== confirmPassword) {
                    message.textContent =
                        "Password lamaan wal hin fakkaatan.";
                    return;
                }


                if (password.length < 6) {
                    message.textContent =
                        "Password yoo xiqqaate qubee 6 qabaachuu qaba.";
                    return;
                }


                const result =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });


                if (result.error) {

                    message.textContent =
                        "Password haaromsuun hin milkoofne.";

                    return;
                }


                message.textContent =
                    "✅ Password kee milkaa'inaan haaromfameera.";

            }
        );
    </script>

</body>

</html>
